name: Anylinux-AppImage
concurrency:
  # the workflow name is part of the group: ci.yml calls this workflow on the
  # same ref, and a shared group made the two runs cancel each other
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-latest, name: Build AppImage, arch: x86_64 }
          # the wails build needs webkitgtk-6.0, which is only packaged for
          # x86_64 on Arch Linux ARM, so aarch64 cannot build this project yet
          # - { runs-on: ubuntu-24.04-arm, name: Build AppImage, arch: aarch64 }
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      - name: Install Dependencies
        run: /bin/sh ./appimage/get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./appimage/make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  # Attaches the AppImage to the release the tag points at. The release itself
  # is published by hand with the other platform packages, so its name and
  # notes are left alone here.
  release:
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
      && needs.build.result == 'success'
      && needs.build-additional-cpu-arches.result != 'failure' }}
    needs: [build, build-additional-cpu-arches]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Release AppImage
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          overwrite_files: true
          files: |
            *.AppImage
            *.AppImage.zsync

  # this part runs via QEMU so expect higher CI times
  build-additional-cpu-arches:
    if: false # set to true to build the below arches
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # comment out the arches that are not wanted
          # note 'if: false' is set by default and these are all turned off
          - { name: Build AppImage, arch: riscv64, platform: linux/riscv64 }
          - { name: Build AppImage, arch: loongarch64, platform: linux/loong64 }
          - { name: Build AppImage, arch: ppc64le, platform: linux/ppc64le }
          - { name: Build AppImage, arch: ppc64, platform: linux/ppc64 } # BE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build AppImage (emulated)
        uses: pkgforge-dev/anylinux-setup-action/emulated@ba7321e11074f9e387a0634e653d09b115d576cd # v6
        with:
          platform: ${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist
